# Existing policies are created/updated by dbt, never by Rails.
schemas:
  - fraudops_marts
  - fraudops_qa_marts
unmask_role: pii_viewers
mask_priority: 0
# The unmask priority is IdentityConfig.store.dbt_unmask_priority (default 100).
statement_timeout_ms: 5000
policies:
  varchar_max:
    mask: dbt_mask_varchar_max
    unmask: dbt_unmask_varchar_max
  int:
    mask: dbt_mask_int
    unmask: dbt_unmask_int
  bigint:
    mask: dbt_mask_bigint
    unmask: dbt_unmask_bigint
  decimal:
    mask: dbt_mask_decimal
    unmask: dbt_unmask_decimal
  boolean:
    mask: dbt_mask_boolean
    unmask: dbt_unmask_boolean
  date:
    mask: dbt_mask_date
    unmask: dbt_unmask_date
  timestamp:
    mask: dbt_mask_timestamp
    unmask: dbt_unmask_timestamp
  super:
    mask: dbt_mask_super
    unmask: dbt_unmask_super
