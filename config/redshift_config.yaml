---
aws_role_map:
  dwadmin: DWAdmin
  dwadminnonprod: DWAdmin
  dwpoweruser: DWPowerUser
  dwpowerusernonprod: DWPowerUser
  dwuser: DWUser
  dwusernonprod: DWUser

role_priority:
  DWAdmin: 3
  DWPowerUser: 2
  DWUser: 1

enabled_aws_groups:
  prod:
    - dwuser
    - dwpoweruser
    - dwadmin
  sandbox:
    - dwuser
    - dwusernonprod
    - dwpoweruser
    - dwpowerusernonprod
    - dwadmin
    - dwadminnonprod

# Redshift users, groups, and roles are global to the cluster
cluster:
  lambda_users:
    - user_name: "IAMR:%{env_name}_db_consumption"
    - user_name: "IAMR:%{env_name}_log_consumption"
    - user_name: "IAMR:%{env_name}_stale_data_check"

  system_users:
    - user_name: security_audit
      secret_id: "redshift/%{env_name}-analytics-security-audit"

    - user_name: quicksight_connector
      feature_flag: 
        - redshift_quicksight_connector_enabled
      secret_id: "redshift/%{env_name}-analytics-quicksight-connector"

    - user_name: idp_connector
      feature_flag: 
        - redshift_idp_connector_enabled
      secret_id: "redshift/%{env_name}-analytics-idp-connector"
      
    - user_name: marts
      feature_flag: 
        - dbt_enabled
      secret_id: "redshift/%{env_name}-analytics-dbt-marts"    

    - user_name: qa_marts
      feature_flag: 
        - dbt_enabled
      secret_id: "redshift/%{env_name}-analytics-dbt-qa_marts"

    - user_name: fraudops_marts
      feature_flag:
        - fraud_ops_tracker_enabled
        - dw_fraudops_email_enabled
      secret_id: "redshift/%{env_name}-analytics-dbt-fraudops_marts"      

    - user_name: fraudops_qa_marts
      feature_flag:
        - fraud_ops_tracker_enabled
        - dw_fraudops_email_enabled
      secret_id: "redshift/%{env_name}-analytics-dbt-fraudops_qa_marts"


    # rails_worker and pii_reader must be created AFTER the fraudops_marts and
    # fraudops_qa_marts users, because those users' grants create the
    # fraudops_marts/fraudops_qa_marts schemas that these users grant on. Keep
    # them ordered after the *_marts entries above; the grant pass applies
    # system-user grants in this same order.
    - user_name: rails_worker
      syslog_access: true
      secret_id: "redshift/%{env_name}-analytics-rails-worker"

    - user_name: pii_reader
      feature_flag:
        - dw_fraudops_email_enabled
        - fraud_ops_tracker_enabled    
      syslog_access: true
      secret_id: "redshift/%{env_name}-analytics-pii-reader"

  user_groups:
    - name: lg_users
      aws_groups:
        prod:
          - dwuser
        sandbox:
          - dwuser
          - dwusernonprod

    - name: lg_powerusers
      aws_groups:
        prod:
          - dwpoweruser
        sandbox:
          - dwpoweruser
          - dwpowerusernonprod

    - name: lg_admins
      aws_groups:
        prod:
          - dwadmin
        sandbox:
          - dwadmin
          - dwadminnonprod

  user_roles:
    - role_name: dw_ingestion
      users:
        - rails_worker
        - superuser
        - "IAMR:%{env_name}_db_consumption"
        - "IAMR:%{env_name}_log_consumption"
        - "IAMR:%{env_name}_stale_data_check"

    - role_name: quicksight_access
      feature_flag: redshift_quicksight_connector_enabled
      users:
        - quicksight_connector

# Database-level GRANTs.
#
# Iterated once per database. The `user_groups`, `system_users`, and
# `lambda_users` sections here carry only the per-database schema/table
# privileges; the identities themselves are defined once under `cluster` above
# and matched by name/user_name. Schema and table objects are database-scoped,
# so these grants must run inside each database.
databases:
  analytics:
    lambda_users:
      - user_name: "IAMR:%{env_name}_db_consumption"
        schemas:
          - idp
          - fraudops
      - user_name: "IAMR:%{env_name}_log_consumption"
        schemas:
          - logs
      - user_name: "IAMR:%{env_name}_stale_data_check"
        schemas:
          - idp
          - logs

    system_users:
      - user_name: security_audit
        schemas:
          - schema_name: pg_catalog
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - pg_user
          - schema_name: system_tables
            schema_privileges: USAGE
            table_privileges: SELECT

      - user_name: quicksight_connector
        schemas:
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - events
              - production
          - schema_name: system_tables
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: marts
            schema_privileges: USAGE
            table_privileges: SELECT

      - user_name: idp_connector
        schemas:
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - events
              - production

      - user_name: marts
        schemas:
          - schema_name: pg_catalog
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: marts
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: USAGE
            table_privileges: SELECT  
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - events
              - production            

      - user_name: qa_marts
        schemas:
          - schema_name: pg_catalog
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: qa_marts
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: USAGE
            table_privileges: SELECT  
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - events
              - production     

      - user_name: fraudops_marts
        schemas:
          - schema_name: pg_catalog
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: fraudops_marts
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT          
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - events
              - production
          - schema_name: fraudops
            schema_privileges: USAGE
            table_privileges: SELECT          

      - user_name: fraudops_qa_marts
        schemas:
          - schema_name: pg_catalog
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: fraudops_qa_marts
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - events
              - production
          - schema_name: fraudops
            schema_privileges: USAGE
            table_privileges: SELECT

      - user_name: rails_worker
        schemas:
          - schema_name: pg_catalog
            schema_privileges: USAGE
            table_privileges: SELECT
            tables:
              - pg_user
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: system_tables
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT, INSERT, UPDATE, DELETE
          - schema_name: fraudops
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled          
            schema_privileges: USAGE, CREATE
            table_privileges: SELECT, INSERT, UPDATE, DELETE
          - schema_name: marts
            feature_flag:
              - dbt_enabled
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: qa_marts
            feature_flag:
              - dbt_enabled
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: fraudops_marts
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled          
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: fraudops_qa_marts
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled
            schema_privileges: USAGE
            table_privileges: SELECT

      - user_name: pii_reader
        schemas:
          - schema_name: fraudops
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: fraudops_marts
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled
            schema_privileges: USAGE
            table_privileges: SELECT

          - schema_name: fraudops_qa_marts
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled
            schema_privileges: USAGE
            table_privileges: SELECT

    user_groups:
      - name: lg_users
        schemas:
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: USAGE
            table_privileges: SELECT            
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            restricted_tables:
              - unextracted_events
              - unextracted_production
          - schema_name: marts
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: qa_marts
            schema_privileges: USAGE
            table_privileges: SELECT

      - name: lg_powerusers
        schemas:
          - schema_name: idp
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: logs
            schema_privileges: USAGE
            table_privileges: SELECT
            restricted_tables:
              - unextracted_events
              - unextracted_production
          - schema_name: marts
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: qa_marts
            schema_privileges: USAGE
            table_privileges: SELECT

      - name: lg_admins
        schemas:
          - schema_name: idp
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: idp_core
            feature_flag: idp_zero_etl_enabled
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: logs
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: system_tables
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: fraudops
            schema_privileges: ALL PRIVILEGES
            table_privileges: ALL PRIVILEGES
          - schema_name: marts
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: qa_marts
            schema_privileges: USAGE
            table_privileges: SELECT
          - schema_name: fraudops_marts
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled
            schema_privileges: USAGE
            table_privileges: SELECT

          - schema_name: fraudops_qa_marts
            feature_flag:
              - fraud_ops_tracker_enabled
              - dw_fraudops_email_enabled          
            schema_privileges: USAGE
            table_privileges: SELECT
            
  # Zero-ETL replica: read-only, schema/table access is granted to only DBT users.
  analytics_zetl:
    feature_flag: idp_zero_etl_enabled
    lambda_users: []
    system_users: []
    user_groups: []
