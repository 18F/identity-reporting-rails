require_version: ">= 2.4"
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  nixpkgs-ruby:
    url: github:bobvanderlinden/nixpkgs-ruby
    inputs:
      nixpkgs:
        follows: nixpkgs
  # Keeps devenv.lock stable for developers still on devenv 1.x
  pre-commit-hooks:
    follows: git-hooks
backend: nix
